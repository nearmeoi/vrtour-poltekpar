<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a5f">
    <meta name="description" content="Tur Virtual 360° Museum & Landmark Sulawesi Selatan.">

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,600;1,500&display=swap" rel="stylesheet">

    <title>Virtual Tour Sulawesi Selatan</title>

    <style>
        body { margin: 0; overflow: hidden; background: #0d1b2a; }
        canvas { display: block; }
    </style>
</head>

<body>
    <div id="landing-screen">
        <!-- Background -->
        <div class="ls-bg">
            <div class="ls-bg-img"></div>
            <div class="ls-bg-overlay"></div>
        </div>

        <!-- Center Content -->
        <div class="ls-center">
            <h1 class="ls-title">Virtual Tour<br><em>Politeknik Pariwisata Makassar</em></h1>
            <p class="ls-sub">Museum Kota Makassar &nbsp;·&nbsp; Museum La Galigo &nbsp;·&nbsp; Pantai Losari</p>

            <button class="ls-btn" id="btn-start-tour">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M5 2.5l8 5.5-8 5.5V2.5z" fill="currentColor"/>
                </svg>
                Mulai Tour
            </button>
        </div>

        <!-- Bottom -->
        <p class="ls-footer">🎧 Gunakan headphone &nbsp;·&nbsp; 360° interaktif</p>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
